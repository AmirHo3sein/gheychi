name: CI

on:
  push:
    branches: ['**']
  pull_request:

# A push to a branch with an open PR fires both `push` and `pull_request` for the same
# commit, running this whole (~15+ minute) job twice; a second push before the first run
# finishes previously left the now-superseded first run going to completion instead of
# being cancelled. Group key is workflow+ref, so this also cancels a main-branch run
# superseded by a newer push to main -- safe there too: a stale build-and-push for a
# commit that's no longer the tip of main is exactly the kind of work that should stop,
# not race the newer one to `latest`.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: gheychi
          POSTGRES_PASSWORD: gheychi
          POSTGRES_DB: gheychi
        ports:
          - "5544:5432"
        options: >-
          --health-cmd "pg_isready -U gheychi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - "6381:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Migrations previously applied only as a side effect of prepare-db.cjs scripts and
      # webServer boot -- no dedicated, clearly-attributed step existed. This makes a
      # duplicate migration timestamp (two branches independently picking the same leading
      # timestamp -- TypeORM applies migrations in filename-sort order regardless) or a
      # broken/non-idempotent migration fail here, with an obvious "Validate migrations"
      # label, instead of surfacing later as a confusing e2e failure.
      #
      # Runs before "Create apps/api/.env" below, so apps/api/.env does not exist yet --
      # data-source.ts's own DB_* defaults (DB_PORT ?? 5432) would otherwise silently miss
      # this job's Postgres service, which is mapped to 5544, not 5432. DB_HOST/DB_USER/
      # DB_PASS are set explicitly for the same reason, even though their defaults happen
      # to already match.
      - name: Validate migrations
        env:
          PGPASSWORD: gheychi
          DB_HOST: localhost
          DB_PORT: 5544
          DB_USER: gheychi
          DB_PASS: gheychi
        run: |
          dupes=$(ls apps/api/src/migrations | sed -E 's/^([0-9]+)-.*/\1/' | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "Duplicate migration timestamp(s): $dupes"
            exit 1
          fi

          psql -h localhost -p 5544 -U gheychi -d postgres -c "CREATE DATABASE gheychi_migration_check;"
          psql -h localhost -p 5544 -U gheychi -d gheychi_migration_check -c "CREATE EXTENSION IF NOT EXISTS postgis;"
          DB_NAME=gheychi_migration_check pnpm --filter @gheychi/api migration:run

      - name: Prepare Postgres databases
        env:
          PGPASSWORD: gheychi
        run: |
          psql -h localhost -p 5544 -U gheychi -d gheychi -c "CREATE EXTENSION IF NOT EXISTS postgis;"
          psql -h localhost -p 5544 -U gheychi -d postgres -c "CREATE DATABASE gheychi_test;"
          psql -h localhost -p 5544 -U gheychi -d gheychi_test -c "CREATE EXTENSION IF NOT EXISTS postgis;"
          # Each Playwright suite's prepare-db.cjs now targets its own gheychi_e2e database
          # (not the shared gheychi dev DB it used to DROP SCHEMA on every run) -- see
          # apps/user-app/e2e/prepare-db.cjs's own comment for the full rationale. Must exist
          # before prepare-db.cjs and the webServer-spawned API process both run, since
          # Playwright gives no ordering guarantee between globalSetup and webServer startup
          # (which is exactly why prepare-db.cjs is a separate pretest step, not globalSetup).
          psql -h localhost -p 5544 -U gheychi -d postgres -c "CREATE DATABASE gheychi_e2e;"
          psql -h localhost -p 5544 -U gheychi -d gheychi_e2e -c "CREATE EXTENSION IF NOT EXISTS postgis;"

      - name: Create apps/api/.env for dev-mode servers (used by Playwright e2e)
        run: cp .env.example apps/api/.env

      # Typecheck ran nowhere in CI until now, which is how a broken `nuxt typecheck` in
      # user-app went unnoticed indefinitely and how response-shape drift between the API and
      # its frontends reached main more than once. Runs before the tests because it is fast
      # and its failures are usually the root cause of the test failures that follow.
      - name: Typecheck
        run: |
          pnpm --filter @gheychi/api typecheck
          pnpm --filter @gheychi/user-app typecheck
          pnpm --filter @gheychi/provider-panel typecheck
          pnpm --filter @gheychi/admin-panel typecheck

      # Runs the coverage-instrumented variant directly rather than `test` then `test:coverage`
      # separately -- coverage instrumentation doesn't change what passes/fails, so a second
      # full run would only double this step's time for no extra signal. Report-only for now
      # (no threshold gate): see the coverage-upload step below for where the actual numbers
      # land. Deciding on/enforcing a minimum is a product call, not something to silently
      # bake into CI.
      - name: Backend unit tests (with coverage)
        run: pnpm --filter @gheychi/api test:coverage

      - name: Backend e2e tests
        run: pnpm --filter @gheychi/api test:e2e

      - name: Frontend unit/component tests (with coverage)
        run: |
          pnpm --filter @gheychi/user-app test:coverage
          pnpm --filter @gheychi/provider-panel test:coverage
          pnpm --filter @gheychi/admin-panel test:coverage

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            apps/api/coverage/
            apps/user-app/coverage/
            apps/provider-panel/coverage/
            apps/admin-panel/coverage/
          retention-days: 14
          if-no-files-found: ignore

      - name: Cache Playwright browsers
        # Keyed on the lockfile hash so a Playwright version bump invalidates it automatically.
        # This only caches the downloaded browser binary (~/.cache/ms-playwright) -- the
        # runner VM is fresh every run, so the OS-level deps (--with-deps below) still need to
        # actually install every time regardless of cache hit; `playwright install` itself
        # skips re-downloading the browser when it's already present at that path, so no
        # conditional logic is needed here beyond restoring the cache before running it.
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        # `playwright` isn't a root dependency (only a devDependency of the three frontend
        # workspaces), so `pnpm exec` needs a --filter to find the binary. The downloaded
        # browser cache is shared across all three apps regardless of which filter installs it.
        run: pnpm --filter @gheychi/user-app exec playwright install --with-deps chromium

      # prepare-db.cjs must run as its own step BEFORE playwright test -- it was missing
      # here entirely, so this step ran playwright straight against whatever gheychi_e2e
      # happened to contain (its schema/seed state depends on migrations auto-running on
      # webServer boot, not a deterministic reset). prepare-db.cjs's own header comment
      # documents exactly why this can't be Playwright's globalSetup instead: no ordering
      # guarantee against the webServer-spawned API process querying the database first.
      # Confirmed as the cause of this step's persistent CI-only failures (duplicate-key
      # violations on already-present rows, eventually a missing-table error) reproducing on
      # unrelated dependency-bump PRs going back days -- never locally, where `pnpm test:e2e`
      # (which does call prepare-db.cjs) is what's actually run.
      - name: user-app Playwright e2e
        run: |
          pnpm --filter @gheychi/user-app exec node e2e/prepare-db.cjs
          pnpm --filter @gheychi/user-app exec playwright test --retries=1

      - name: Upload user-app Playwright trace/video on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: user-app-playwright-report
          path: apps/user-app/test-results/
          retention-days: 7
          if-no-files-found: ignore

      # Each Playwright suite's webServer config spawns its own `nest start --watch` API
      # process (reuseExistingServer is always false in CI). If it survives into the next
      # suite, its own background @nestjs/schedule cron jobs race that suite's global-setup
      # (which drops/recreates the schema and re-runs migrations), querying a table mid-migration.
      - name: Kill any lingering api dev server
        if: always()
        run: pkill -f "nest start" || true

      - name: provider-panel Playwright e2e
        run: |
          pnpm --filter @gheychi/provider-panel exec node e2e/prepare-db.cjs
          pnpm --filter @gheychi/provider-panel exec playwright test --retries=1

      - name: Upload provider-panel Playwright trace/video on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-panel-playwright-report
          path: apps/provider-panel/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Kill any lingering api dev server
        if: always()
        run: pkill -f "nest start" || true

      - name: admin-panel Playwright e2e
        run: |
          pnpm --filter @gheychi/admin-panel exec node e2e/prepare-db.cjs
          pnpm --filter @gheychi/admin-panel exec playwright test --retries=1

      - name: Upload admin-panel Playwright trace/video on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-panel-playwright-report
          path: apps/admin-panel/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Kill any lingering api dev server
        if: always()
        run: pkill -f "nest start" || true

      # The one deliberate gap the three suites above share: none of them follows a booking
      # created in one app into another. This spawns api + user-app + provider-panel
      # together and drives a single booking across both frontends in one test -- see
      # apps/e2e-cross-app/playwright.config.ts's own header comment.
      - name: Cross-app booking flow e2e
        run: |
          pnpm --filter @gheychi/e2e-cross-app exec node e2e/prepare-db.cjs
          pnpm --filter @gheychi/e2e-cross-app exec playwright test --retries=1

      - name: Upload cross-app Playwright trace/video on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-app-playwright-report
          path: apps/e2e-cross-app/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Kill any lingering api dev server
        if: always()
        run: pkill -f "nest start" || true

      - name: Build all apps
        run: pnpm build

  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # fetch-depth: 0 + fetch-tags: true -- `git describe --tags` below needs the full
      # history and tag refs, which the default shallow (depth-1, no-tags) checkout doesn't
      # have.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Lowercase the GHCR image owner
        run: echo "OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      # Deploy identity baked into the api image (apps/api/Dockerfile ARG -> ENV), surfaced
      # at runtime via GET /version -- see that endpoint's own doc comments for why these
      # are build-time facts, not deploy-time .env values. `git describe --tags --always`
      # is deterministic and self-documenting: exactly "v1.0.0" at a tagged commit, or
      # "v1.0.0-3-gabc1234" three commits past the last tag, or a bare short SHA if no tag
      # exists yet -- never invented, always derived from real git state.
      - name: Compute release identity
        run: |
          echo "APP_VERSION=$(git describe --tags --always)" >> "$GITHUB_ENV"
          echo "BUILD_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push api
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
            APP_VERSION=${{ env.APP_VERSION }}
            BUILD_TIMESTAMP=${{ env.BUILD_TIMESTAMP }}
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/gheychi-api:${{ github.sha }}
            ghcr.io/${{ env.OWNER_LC }}/gheychi-api:latest

      - name: Build and push user-app
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/user-app/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/gheychi-user-app:${{ github.sha }}
            ghcr.io/${{ env.OWNER_LC }}/gheychi-user-app:latest

      - name: Build and push provider-panel
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/provider-panel/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE=${{ vars.VITE_API_BASE_PROD }}
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/gheychi-provider-panel:${{ github.sha }}
            ghcr.io/${{ env.OWNER_LC }}/gheychi-provider-panel:latest

      - name: Build and push admin-panel
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/admin-panel/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE=${{ vars.VITE_API_BASE_PROD }}
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/gheychi-admin-panel:${{ github.sha }}
            ghcr.io/${{ env.OWNER_LC }}/gheychi-admin-panel:latest
