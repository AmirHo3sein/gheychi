name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: gheychi
          POSTGRES_PASSWORD: gheychi
          POSTGRES_DB: gheychi
        ports:
          - "5544:5432"
        options: >-
          --health-cmd "pg_isready -U gheychi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - "6381:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Postgres databases
        env:
          PGPASSWORD: gheychi
        run: |
          psql -h localhost -p 5544 -U gheychi -d gheychi -c "CREATE EXTENSION IF NOT EXISTS postgis;"
          psql -h localhost -p 5544 -U gheychi -d postgres -c "CREATE DATABASE gheychi_test;"
          psql -h localhost -p 5544 -U gheychi -d gheychi_test -c "CREATE EXTENSION IF NOT EXISTS postgis;"
          # Each Playwright suite's prepare-db.cjs now targets its own gheychi_e2e database
          # (not the shared gheychi dev DB it used to DROP SCHEMA on every run) -- see
          # apps/user-app/e2e/prepare-db.cjs's own comment for the full rationale. Must exist
          # before prepare-db.cjs and the webServer-spawned API process both run, since
          # Playwright gives no ordering guarantee between globalSetup and webServer startup
          # (which is exactly why prepare-db.cjs is a separate pretest step, not globalSetup).
          psql -h localhost -p 5544 -U gheychi -d postgres -c "CREATE DATABASE gheychi_e2e;"
          psql -h localhost -p 5544 -U gheychi -d gheychi_e2e -c "CREATE EXTENSION IF NOT EXISTS postgis;"

      - name: Create apps/api/.env for dev-mode servers (used by Playwright e2e)
        run: cp .env.example apps/api/.env

      # Typecheck ran nowhere in CI until now, which is how a broken `nuxt typecheck` in
      # user-app went unnoticed indefinitely and how response-shape drift between the API and
      # its frontends reached main more than once. Runs before the tests because it is fast
      # and its failures are usually the root cause of the test failures that follow.
      - name: Typecheck
        run: |
          pnpm --filter @gheychi/api typecheck
          pnpm --filter @gheychi/user-app typecheck
          pnpm --filter @gheychi/provider-panel typecheck
          pnpm --filter @gheychi/admin-panel typecheck

      - name: Backend unit tests
        run: pnpm --filter @gheychi/api test

      - name: Backend e2e tests
        run: pnpm --filter @gheychi/api test:e2e

      - name: Frontend unit/component tests
        run: |
          pnpm --filter @gheychi/user-app test
          pnpm --filter @gheychi/provider-panel test
          pnpm --filter @gheychi/admin-panel test

      - name: Cache Playwright browsers
        # Keyed on the lockfile hash so a Playwright version bump invalidates it automatically.
        # This only caches the downloaded browser binary (~/.cache/ms-playwright) -- the
        # runner VM is fresh every run, so the OS-level deps (--with-deps below) still need to
        # actually install every time regardless of cache hit; `playwright install` itself
        # skips re-downloading the browser when it's already present at that path, so no
        # conditional logic is needed here beyond restoring the cache before running it.
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        # `playwright` isn't a root dependency (only a devDependency of the three frontend
        # workspaces), so `pnpm exec` needs a --filter to find the binary. The downloaded
        # browser cache is shared across all three apps regardless of which filter installs it.
        run: pnpm --filter @gheychi/user-app exec playwright install --with-deps chromium

      - name: user-app Playwright e2e
        run: pnpm --filter @gheychi/user-app exec playwright test --retries=1

      - name: Upload user-app Playwright trace/video on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: user-app-playwright-report
          path: apps/user-app/test-results/
          retention-days: 7
          if-no-files-found: ignore

      # Each Playwright suite's webServer config spawns its own `nest start --watch` API
      # process (reuseExistingServer is always false in CI). If it survives into the next
      # suite, its own background @nestjs/schedule cron jobs race that suite's global-setup
      # (which drops/recreates the schema and re-runs migrations), querying a table mid-migration.
      - name: Kill any lingering api dev server
        if: always()
        run: pkill -f "nest start" || true

      - name: provider-panel Playwright e2e
        run: pnpm --filter @gheychi/provider-panel exec playwright test --retries=1

      - name: Kill any lingering api dev server
        if: always()
        run: pkill -f "nest start" || true

      - name: admin-panel Playwright e2e
        run: pnpm --filter @gheychi/admin-panel exec playwright test --retries=1

      - name: Build all apps
        run: pnpm build

  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Lowercase the GHCR image owner
        run: echo "OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push api
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/gheychi-api:${{ github.sha }}
            ghcr.io/${{ env.OWNER_LC }}/gheychi-api:latest

      - name: Build and push user-app
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/user-app/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/gheychi-user-app:${{ github.sha }}
            ghcr.io/${{ env.OWNER_LC }}/gheychi-user-app:latest

      - name: Build and push provider-panel
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/provider-panel/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE=${{ vars.VITE_API_BASE_PROD }}
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/gheychi-provider-panel:${{ github.sha }}
            ghcr.io/${{ env.OWNER_LC }}/gheychi-provider-panel:latest

      - name: Build and push admin-panel
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/admin-panel/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE=${{ vars.VITE_API_BASE_PROD }}
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/gheychi-admin-panel:${{ github.sha }}
            ghcr.io/${{ env.OWNER_LC }}/gheychi-admin-panel:latest
