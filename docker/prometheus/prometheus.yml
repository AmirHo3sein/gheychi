# Scrapes the api container directly over the compose `internal` network -- GET /api/metrics
# is a real, public (unauthenticated by design) Prometheus endpoint (see
# apps/api/src/metrics/metrics.controller.ts), but this scrape never leaves the Docker
# network: Caddy has no route for it, so it's not reachable from the public internet either
# way. See docs/deployment/DEPLOY.md's "Observability" section for how to actually view this
# data (an SSH tunnel to Grafana, not a public dashboard URL).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: gheychi-api
    metrics_path: /api/metrics
    static_configs:
      - targets: ['api:3002']
