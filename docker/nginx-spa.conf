server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The provider panel's service worker keeps one URL across builds, so it must never be
    # served from a stale cache (the immutable rule below is for hashed assets only).
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(?:css|js|svg|woff2?|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
