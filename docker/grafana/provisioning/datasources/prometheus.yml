# Auto-provisions the Prometheus datasource on Grafana boot -- no manual UI click needed
# for the one piece every dashboard depends on. See docs/deployment/DEPLOY.md's
# "Observability" section.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
