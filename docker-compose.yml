services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: arayeshgah
      POSTGRES_PASSWORD: arayeshgah
      POSTGRES_DB: arayeshgah
    ports:
      - "5544:5432"
    volumes:
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"

volumes:
  pgdata:
