# Pinned so container/volume names never depend on what the checkout directory
# happens to be called -- renaming the directory would otherwise start a fresh
# project with empty volumes and strand the existing data under the old name.
name: gheychi

# Every service below carries a conservative mem_limit/cpus ceiling -- a leak or runaway
# burst in any ONE container (most plausibly api) must not be able to starve the whole
# single-VPS host and take down every other service with it. These are deliberately
# generous starting points (bound a genuine leak, not tuned to normal peak usage) rather
# than measured allocations -- re-tune to the actual VPS's total RAM/vCPU before relying
# on them as a hard sizing guarantee. memswap_limit == mem_limit disables swap for that
# container, so mem_limit is a real ceiling, not a soft one the kernel can paper over.
services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1.5
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Not publicly exposed (no published port, internal network only), but that was the
    # ONLY control -- any compromised sibling container on this network could otherwise
    # read live OTP codes (a full account-takeover primitive), delete cron/booking locks
    # to force duplicate job runs, or clear rate-limit counters. requirepass closes that.
    # Also disables CONFIG (an unauthenticated caller could otherwise reconfigure a
    # running Redis instance, e.g. turning off persistence or renaming other commands).
    # ${REDIS_PASSWORD} is resolved by Compose's own variable substitution from the .env
    # file in this same deploy directory -- deliberately NOT `env_file: .env` on this
    # service, which would hand redis the whole shared secret bag for no reason beyond
    # this one value (the same "every container gets the full .env" debt tracked in
    # docs/technical-overview/24-technical-debt.md; no need to add a new instance of it).
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --rename-command CONFIG ""
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    networks: [internal]

  api:
    image: ghcr.io/amirho3sein/gheychi-api:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3002/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    # Uploaded images (salon photos/stories/portfolio, blog covers) live on disk under
    # /app/uploads while STORAGE_PROVIDER=local -- without a volume they were inside the
    # container's writable layer and silently destroyed on every `docker compose up -d`
    # that recreated the container (each image pull), leaving DB rows pointing at 404s.
    volumes:
      - api_uploads:/app/uploads
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 1.5
    networks: [internal]

  user-app:
    image: ghcr.io/amirho3sein/gheychi-user-app:latest
    restart: unless-stopped
    env_file: .env
    # Overrides the shared .env's PORT=3002 (meant for api, which reads process.env.PORT
    # directly) -- env_file values otherwise win over this image's own Dockerfile-baked
    # ENV PORT=3003 default, so without this override user-app silently listens on 3002
    # instead of 3003, and Caddy's user-app:3003 reverse_proxy 502s with connection refused.
    environment:
      PORT: 3003
    depends_on: [api]
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    networks: [internal]

  provider-panel:
    image: ghcr.io/amirho3sein/gheychi-provider-panel:latest
    restart: unless-stopped
    depends_on: [api]
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.3
    networks: [internal]

  admin-panel:
    image: ghcr.io/amirho3sein/gheychi-admin-panel:latest
    restart: unless-stopped
    depends_on: [api]
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.3
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    env_file: .env
    depends_on: [api, user-app, provider-panel, admin-panel]
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.5
    networks: [internal]

  backup:
    build:
      context: .
      dockerfile: docker/backup/Dockerfile
    restart: unless-stopped
    # Already shares the root .env with every other service -- this is how BACKUP_REPORT_SECRET
    # (see .env.example) reaches this container without a separate `environment:` entry.
    # backup.sh addresses the api container by its compose service name (`api`, on this same
    # `internal` network) on port 3002, exactly like every other service-to-service call in
    # this stack (see api's own healthcheck above) -- no explicit BACKUP_REPORT_URL override
    # is needed here; it only exists as an env var for local/non-compose testing.
    env_file: .env
    # READ-ONLY view of the same named volume `api` writes uploads into. With
    # STORAGE_PROVIDER=local (what production actually runs), every salon photo, story,
    # portfolio image and blog cover exists ONLY in this volume -- losing the VPS used to
    # mean losing all of them permanently while the restored database kept pointing at
    # dead URLs. backup.sh mirrors this directory to s3://$S3_BUCKET/uploads/ after the
    # Postgres dump. `:ro` is load-bearing, not decoration: a backup container has no
    # business being able to modify (or `mc mirror --remove` its way through) the live
    # uploads it exists to protect.
    volumes:
      - api_uploads:/uploads:ro
    # Deliberately NOT `depends_on: api`: this container's job (dump + verify + upload) must
    # not be gated on api being up, and backup.sh's own POST to api is best-effort by design
    # (see that script's report_backup() comment) -- a slow/down api container delays or
    # skips telemetry, never the backup itself.
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    networks: [internal]

  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # A single-VPS deploy has no long-term metrics-retention need beyond spotting a
      # recent regression/incident -- bounded to keep disk usage predictable rather than
      # growing forever.
      - --storage.tsdb.retention.time=30d
    depends_on: [api]
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.5
    networks: [internal]

  grafana:
    image: grafana/grafana-oss:11.4.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # No public route for this exists in the Caddyfile -- see the port mapping below.
      GF_SERVER_ROOT_URL: http://localhost:3000
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    # Loopback-only -- deliberately NOT proxied through Caddy (no DOMAIN_* var claims a
    # subdomain for it, no TLS cert requested for it). View it via an SSH tunnel
    # (`ssh -L 3000:localhost:3000 <host>`, then http://localhost:3000 locally) -- see
    # docs/deployment/DEPLOY.md's "Observability" section. Exposing it publicly later is a
    # deliberate follow-up (a real subdomain + TLS + this same admin password), not an
    # oversight.
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus]
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    networks: [internal]

networks:
  internal:

volumes:
  pgdata:
  api_uploads:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
